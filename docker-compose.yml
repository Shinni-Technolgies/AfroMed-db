services:
  db:
    image: postgres:latest
    container_name: afromed-db
    env_file:
      - .env
    # db-entrypoint.sh constructs DATABASE_URI from individual DB_* vars,
    # exports POSTGRES_USER/PASSWORD/DB, then delegates to the
    # official postgres docker-entrypoint.sh.
    entrypoint: ["sh", "/init_scripts/db-entrypoint.sh"]
    command: ["postgres"]
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./migrations:/migrations:ro
      - ./seed.sql:/seed.sql:ro
      - ./init_scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./init_scripts/db-entrypoint.sh:/init_scripts/db-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U $DB_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: afromed-pgadmin
    env_file:
      - .env
    # pgadmin-entrypoint.sh constructs DATABASE_URI from individual DB_* vars,
    # generates servers.json and pgpass at runtime, then starts pgAdmin.
    entrypoint: ["sh", "/init_scripts/pgadmin-entrypoint.sh"]
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./init_scripts/pgadmin-entrypoint.sh:/init_scripts/pgadmin-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
