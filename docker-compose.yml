services:
  db:
    image: postgres:latest
    container_name: afromed-db
    environment:
      POSTGRES_USER: afromed
      POSTGRES_PASSWORD: afromed_password
      POSTGRES_DB: afromed_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./seed.sql:/seed.sql:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afromed -d afromed_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: afromed-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@afromed.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
